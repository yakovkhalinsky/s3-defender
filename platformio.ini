; s3-defender — LilyGO T-Dongle-S3
; https://github.com/Xinyuan-LilyGO/T-Dongle-S3
;
; NOTE: pins are exact (no caret). NimBLE 2.x requires arduino core 3.x; the
; ESP32Async forks replaced the archived mathieucarbou ones. TFT_eSPI must be
; configured with USE_HSPI_PORT below or tft.init() panics on core >= 2.0.15.

[env:t-dongle-s3]
platform                = espressif32 @ 6.12.0     ; arduino-esp32 2.0.17 / IDF 4.4.7
board                   = esp32-s3-devkitc-1
framework               = arduino
monitor_speed           = 115200
monitor_filters         = esp32_exception_decoder
upload_speed            = 921600
board_build.flash_mode  = qio
board_build.f_flash     = 80000000L
board_build.flash_size  = 16MB
board_upload.flash_size = 16MB
                        ; app ~3MB is enough; escape hatch: noota_16MB.csv
board_build.partitions  = default_16MB.csv
lib_compat_mode         = strict
extra_scripts           = pre:tools/gen_web_assets.py
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D CORE_DEBUG_LEVEL=1
  ; ---------- app ----------
  -D S3_DEFENDER_SOFTAP_SSID=\"S3-Defender\"
  ;-D S3_DEFENDER_SOFTAP_PASS=\"password\"      ; define to enable WPA2
  -D S3_DEFENDER_SOFTAP_CHANNEL=1
  -D S3_DEFENDER_WIFI_MAX=48
  -D S3_DEFENDER_BLE_MAX=64
  -D S3_DEFENDER_WS_TOPK=24
  -D S3_DEFENDER_LOG_MAX_BYTES=8388608
  ; ---------- TFT_eSPI : ST7735 160x80 (LilyGO Setup47_ST7735.h) ----------
  ; USE_HSPI_PORT is MANDATORY on core >= 2.0.15 (REG_SPI_BASE bug: default
  ; FSPI port resolves to a NULL base and tft.init() StoreProhibits).
  -D USER_SETUP_LOADED=1
  -D USE_HSPI_PORT=1
  -D ST7735_DRIVER=1
  -D ST7735_GREENTAB160x80=1
  -D TFT_WIDTH=80
  -D TFT_HEIGHT=160
  -D TFT_MISO=-1
  -D TFT_MOSI=3
  -D TFT_SCLK=5
  -D TFT_CS=4
  -D TFT_DC=2
  -D TFT_RST=1
  -D TFT_RGB_ORDER=TFT_BGR
  -D SPI_FREQUENCY=27000000
  -D SPI_READ_FREQUENCY=20000000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D DISABLE_ALL_LIBRARY_WARNINGS=1
  ; ---------- NimBLE : scanner only ----------
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED=1
  -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED=1
  -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED=1
  ; ---------- AsyncTCP ----------
  -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
lib_deps =
  bblanchon/ArduinoJson @ 7.4.3
  h2zero/NimBLE-Arduino @ 1.4.3
  ESP32Async/AsyncTCP @ 3.4.10
  ESP32Async/ESPAsyncWebServer @ 3.12.1
  bodmer/TFT_eSPI @ 2.5.43